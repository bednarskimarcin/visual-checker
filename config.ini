[checker]
; Folder where file1/file2 are looked up (unless an absolute or existing path is given)
input_dir = ./input
; text (default) = OCR both screenshots and compare the texts
; visual = compare blocks (text blocks, buttons, form fields, icons) by look, no OCR
mode = visual
; Folder where report files are written
report_dir = ./reports
; Ignore OCR results with confidence below this value (0..1)
min_confidence = 0.5

[layout]
; Boxes belong to one line if their vertical centers differ by less than
; this fraction of the line height
line_tolerance = 0.5
; A vertical gap larger than this many line heights starts a new section
section_gap = 1.0
; Text on the same row separated by more than this many line heights is split
; into separate sections (columns, side-by-side buttons)
column_gap = 2.5

[compare]
; Minimum text similarity (0..1) for two sections to be treated as the same section
match_threshold = 0.6
; Shifts larger than this (% of image width/height) are reported as "moved" (both modes)
position_tolerance = 2.0

[visual]
; Color difference per pixel (0..255) that is ignored (anti-aliasing, compression noise)
pixel_tolerance = 40
; A block counts as changed when more than this % of its content pixels differ
change_tolerance = 3.0
; Blocks may differ in size by this % and still be matched as the same element
size_tolerance = 10
; Elements closer than this many pixels (horizontally / vertically) form one block
merge_x = 15
merge_y = 10
; Ignore specks smaller than this many pixels in both directions
min_block_size = 4
; Elements inside a container up to this % of the image (button, input field) are part of it;
; inside bigger containers (cards, panels) they are compared as separate blocks
max_widget_area = 15
